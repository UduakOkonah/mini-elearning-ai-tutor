<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI E-Learning | Sign Up / Login</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <main class="auth-container">
    <h2>Sign Up / Login</h2>
    <form id="auth-form">
      <input type="text" id="username" placeholder="Username" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Continue</button>
    </form>
    <p id="auth-message"></p>
  </main>

  <script>
    document.getElementById("auth-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !email || !password) return;

      const users = JSON.parse(localStorage.getItem("ai_users") || "[]");
      const existingUser = users.find(u => u.email === email);

      if (!existingUser) {
        users.push({ username, email, password });
        localStorage.setItem("ai_users", JSON.stringify(users));
        document.getElementById("auth-message").innerText = `Account created for ${username}. Logging you in...`;
      } else if (existingUser.password === password) {
        document.getElementById("auth-message").innerText = `Welcome back, ${existingUser.username}! Logging you in...`;
      } else {
        document.getElementById("auth-message").innerText = `Incorrect password. Try again.`;
        return;
      }

      localStorage.setItem("ai_user", username);
      setTimeout(() => window.location.href = "index.html", 1000);
    });
  </script>
</body>
</html>
